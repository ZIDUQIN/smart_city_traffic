brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 关键：让宿主机上的 Java 客户端能连到这个地址（本地开发用 127.0.0.1）
brokerIP1 = 127.0.0.1

# 自动创建 topic，本地开发省去手动建 topic
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
